
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natural Photo Enhancer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px 14px;
  background: #101827;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #55d6d0;
}

.subtitle {
  text-align: center;
  color: #b8c4d6;
  line-height: 1.6;
}

.panel {
  background: #1d293b;
  padding: 18px;
  border-radius: 16px;
  margin-top: 18px;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  background: #26364b;
  border-radius: 10px;
  color: white;
}

.preview {
  width: 100%;
  margin-top: 16px;
  border-radius: 12px;
  display: block;
  background: #0b1220;
}

.control {
  margin: 20px 0;
}

.control label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-weight: bold;
}

input[type="range"] {
  width: 100%;
  accent-color: #55d6d0;
}

button {
  width: 100%;
  border: 0;
  padding: 14px;
  border-radius: 10px;
  margin-top: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.download {
  background: #55d6d0;
  color: #10202b;
}

.reset {
  background: #35445a;
  color: white;
}

.original {
  background: #43516a;
  color: white;
}

.note {
  color: #aebdd0;
  font-size: 12px;
  text-align: center;
  line-height: 1.6;
  margin-top: 18px;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
  margin-top: 16px;
  background: #0b1220;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<div class="container">

<h1>Natural Photo Enhancer</h1>

<p class="subtitle">
Enhance your photos naturally while keeping your original features unchanged.
</p>

<div class="panel">

<input type="file" id="upload" accept="image/*">

<canvas id="canvas" class="hidden"></canvas>

<div id="message" class="note">
Upload a photo to get started.
</div>

<div id="controls" class="hidden">

<div class="control">
<label>
Brightness
<span id="brightnessValue">100%</span>
</label>
<input type="range" id="brightness"
min="50" max="150" value="100">
</div>

<div class="control">
<label>
Contrast
<span id="contrastValue">100%</span>
</label>
<input type="range" id="contrast"
min="50" max="150" value="100">
</div>

<div class="control">
<label>
Sharpness
<span id="sharpnessValue">0</span>
</label>
<input type="range" id="sharpness"
min="0" max="100" value="0">
</div>

<div class="control">
<label>
Clarity
<span id="clarityValue">0</span>
</label>
<input type="range" id="clarity"
min="0" max="100" value="0">
</div>

<button class="original" id="originalBtn">
Show Original Photo
</button>

<button class="reset" id="resetBtn">
Reset Adjustments
</button>

<button class="download" id="downloadBtn">
Download Enhanced Photo
</button>

</div>
</div>

<p class="note">
Your original photo remains unchanged.
Enhancements are processed in your browser.
</p>

</div>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

const controls = document.getElementById("controls");
const message = document.getElementById("message");

const brightness = document.getElementById("brightness");
const contrast = document.getElementById("contrast");
const sharpness = document.getElementById("sharpness");
const clarity = document.getElementById("clarity");

let originalImage = null;
let originalData = null;
let originalMode = false;

function updateLabels() {
  document.getElementById("brightnessValue").textContent =
    brightness.value + "%";

  document.getElementById("contrastValue").textContent =
    contrast.value + "%";

  document.getElementById("sharpnessValue").textContent =
    sharpness.value;

  document.getElementById("clarityValue").textContent =
    clarity.value;
}

upload.addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    message.textContent = "Please select an image.";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    const img = new Image();

    img.onload = function() {
      originalImage = img;

      const scale = Math.min(
        1,
        2200 / Math.max(img.width, img.height)
      );

      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      originalData = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      controls.classList.remove("hidden");
      canvas.classList.remove("hidden");
      message.textContent = "Photo uploaded successfully.";

      resetAdjustments();
    };

    img.onerror = function() {
      message.textContent = "Could not load this photo.";
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
});

function renderPhoto() {
  if (!originalData || originalMode) return;

  const width = canvas.width;
  const height = canvas.height;

  const imageData = new ImageData(
    new Uint8ClampedArray(originalData.data),
    width,
    height
  );

  const data = imageData.data;

  const bright = Number(brightness.value) / 100;
  const contrastValue = Number(contrast.value) / 100;

  const factor =
    (259 * (contrastValue * 255 + 255)) /
    (255 * (259 - contrastValue * 255));

  for (let i = 0; i < data.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const value = data[i + c] * bright;
      data[i + c] = factor * (value - 128) + 128;
    }
  }

  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = width;
  tempCanvas.height = height;

  const tempCtx = tempCanvas.getContext("2d", {
    willReadFrequently: true
  });

  tempCtx.putImageData(imageData, 0, 0);

  const amount =
    Number(sharpness.value) / 100 * 1.5 +
    Number(clarity.value) / 100 * 0.8;

  if (amount > 0) {
    const blurCanvas = document.createElement("canvas");
    blurCanvas.width = width;
    blurCanvas.height = height;

    const blurCtx = blurCanvas.getContext("2d", {
      willReadFrequently: true
    });

    blurCtx.filter = "blur(1px)";
    blurCtx.drawImage(tempCanvas, 0, 0);
    blurCtx.filter = "none";

    const base = tempCtx.getImageData(0, 0, width, height);
    const blurred = blurCtx.getImageData(0, 0, width, height);

    const output = base.data;
    const soft = blurred.data;

    for (let i = 0; i < output.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        output[i + c] =
          output[i + c] +
          (output[i + c] - soft[i + c]) * amount;
      }
    }

    tempCtx.putImageData(base, 0, 0);
  }

  ctx.putImageData(
    tempCtx.getImageData(0, 0, width, height),
    0, 0
  );
}

function resetAdjustments() {
  brightness.value = 100;
  contrast.value = 100;
  sharpness.value = 0;
  clarity.value = 0;

  originalMode = false;

  updateLabels();
  renderPhoto();

  document.getElementById("originalBtn").textContent =
    "Show Original Photo";
}

[brightness, contrast, sharpness, clarity].forEach(control => {
  control.addEventListener("input", function() {
    originalMode = false;
    updateLabels();
    renderPhoto();

    document.getElementById("originalBtn").textContent =
      "Show Original Photo";
  });
});

document.getElementById("originalBtn").addEventListener("click", function() {
  if (!originalData) return;

  originalMode = !originalMode;

  if (originalMode) {
    ctx.putImageData(originalData, 0, 0);
    this.textContent = "Show Enhanced Photo";
  } else {
    renderPhoto();
    this.textContent = "Show Original Photo";
  }
});

document.getElementById("resetBtn").addEventListener(
  "click", resetAdjustments
);

document.getElementById("downloadBtn").addEventListener("click", function() {
  if (!originalData) return;

  if (originalMode) {
    originalMode = false;
    renderPhoto();
    document.getElementById("originalBtn").textContent =
      "Show Original Photo";
  }

  const link = document.createElement("a");
  link.download = "enhanced-photo.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});
</script>

</body>
</html>
